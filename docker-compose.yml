services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: fridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: compose-dev-password
    volumes:
      - fridge-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - fridge-uploads:/app/wwwroot/uploads
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Database=fridge;Username=postgres;Password=compose-dev-password
      ImageStorage__Provider: Local
      Gemini__Enabled: "false"
      Seed__AdminUserName: admin
      Seed__AdminEmail: admin@example.com
      Seed__AdminPassword: LocalDev!Pass1
      Seed__DemoData: "true"

volumes:
  fridge-pg:
  fridge-uploads:
