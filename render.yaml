# Fridge Manager — Render Blueprint
#
# Secrets use sync: false and are entered in the Render Dashboard on first
# create. DATABASE_URL is wired from the attached Postgres instance.

databases:
  - name: fridge-db
    postgresMajorVersion: "18"
    plan: free
    databaseName: fridge

services:
  - type: web
    name: fridge-manager
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: ImageStorage__Provider
        value: R2
      - key: Gemini__Enabled
        value: "false"
      - key: Seed__DemoData
        value: "true"
      - key: Seed__AdminUserName
        sync: false
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false
      - key: R2__ServiceUrl
        sync: false
      - key: R2__AccessKeyId
        sync: false
      - key: R2__SecretAccessKey
        sync: false
      - key: R2__BucketName
        sync: false
      - key: R2__PublicBaseUrl
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fridge-db
          property: connectionString
