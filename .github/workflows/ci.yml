name: CI

on:
  push:
    branches:
      - main
      - deploy/heroku
  pull_request:
    branches:
      - main
      - deploy/heroku
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      - run: dotnet build -c Release
      - run: dotnet test -c Release
      - run: docker build .
